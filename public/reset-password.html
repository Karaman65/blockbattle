<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Battle - Şifre Yenile</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 22% 18%, rgba(0, 243, 255, 0.18), transparent 28%),
        radial-gradient(circle at 78% 72%, rgba(255, 0, 122, 0.18), transparent 30%),
        #05050f;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: min(440px, 100%);
      padding: 34px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      background: rgba(18, 18, 43, 0.92);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.48), 0 0 36px rgba(0, 243, 255, 0.14);
    }

    .logo {
      margin: 0 0 8px;
      font-size: 2.35rem;
      font-weight: 950;
      letter-spacing: 0;
      line-height: 1;
    }

    .logo span {
      color: #00f3ff;
    }

    h1 {
      margin: 22px 0 8px;
      font-size: 1.35rem;
      line-height: 1.2;
    }

    p {
      margin: 0 0 22px;
      color: #a5b4fc;
      line-height: 1.55;
    }

    label {
      display: block;
      margin: 14px 0 8px;
      color: #dbe6ff;
      font-size: 0.86rem;
      font-weight: 800;
    }

    input {
      width: 100%;
      min-height: 52px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 0 14px;
      background: #070711;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: #00f3ff;
      box-shadow: 0 0 0 3px rgba(0, 243, 255, 0.13);
    }

    button, .link-button {
      width: 100%;
      min-height: 54px;
      margin-top: 18px;
      border: 0;
      border-radius: 10px;
      display: inline-grid;
      place-items: center;
      background: linear-gradient(135deg, #ff007a, #7c3cff);
      color: #ffffff;
      font: inherit;
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(255, 0, 122, 0.28);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.72;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-weight: 800;
      line-height: 1.4;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: rgba(255, 62, 62, 0.12);
      color: #ff7474;
      border: 1px solid rgba(255, 62, 62, 0.32);
    }

    .message.success {
      background: rgba(0, 255, 157, 0.12);
      color: #70ffc6;
      border: 1px solid rgba(0, 255, 157, 0.28);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 26px;
      }

      .logo {
        font-size: 1.9rem;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">BLOCK<span>BATTLE</span></div>
    <h1>Şifreni yenile</h1>
    <p id="intro">Yeni şifreni belirleyerek hesabına güvenli şekilde tekrar giriş yapabilirsin.</p>

    <form id="reset-form">
      <label for="password">Yeni şifre</label>
      <input id="password" type="password" minlength="6" autocomplete="new-password" required>

      <label for="password-confirm">Yeni şifre tekrar</label>
      <input id="password-confirm" type="password" minlength="6" autocomplete="new-password" required>

      <button id="submit-btn" type="submit">Şifreyi Güncelle</button>
    </form>

    <div id="message" class="message"></div>
    <a id="login-link" class="link-button hidden" href="/">Oyuna Geri Dön</a>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=4.5"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode');
    const oobCode = params.get('oobCode');
    const form = document.getElementById('reset-form');
    const submitBtn = document.getElementById('submit-btn');
    const message = document.getElementById('message');
    const loginLink = document.getElementById('login-link');
    const intro = document.getElementById('intro');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message show ${type}`;
    }

    function disableForm() {
      form.classList.add('hidden');
    }

    if (mode !== 'resetPassword' || !oobCode) {
      disableForm();
      intro.textContent = 'Bu şifre yenileme bağlantısı geçerli görünmüyor.';
      showMessage('Mailindeki son şifre sıfırlama bağlantısını tekrar açmayı dene.', 'error');
      loginLink.classList.remove('hidden');
    } else {
      auth.verifyPasswordResetCode(oobCode).catch(() => {
        disableForm();
        intro.textContent = 'Bu bağlantı artık kullanılamıyor.';
        showMessage('Bağlantının süresi dolmuş veya daha önce kullanılmış olabilir. Giriş ekranından yeni şifre sıfırlama maili iste.', 'error');
        loginLink.classList.remove('hidden');
      });
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('password-confirm').value;

      if (password.length < 6) {
        showMessage('Şifre en az 6 karakter olmalı.', 'error');
        return;
      }

      if (password !== confirm) {
        showMessage('Şifreler aynı değil.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Güncelleniyor...';

      try {
        await auth.confirmPasswordReset(oobCode, password);
        disableForm();
        intro.textContent = 'Şifren başarıyla güncellendi.';
        showMessage('Artık yeni şifrenle Block Battle hesabına giriş yapabilirsin.', 'success');
        loginLink.classList.remove('hidden');
      } catch (err) {
        showMessage('Şifre güncellenemedi. Bağlantı süresi dolmuş olabilir.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Şifreyi Güncelle';
      }
    });
  </script>
</body>

</html>

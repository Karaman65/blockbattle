<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Battle - Şifre Yenile</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 22% 18%, rgba(0, 243, 255, 0.18), transparent 28%),
        radial-gradient(circle at 78% 72%, rgba(255, 0, 122, 0.18), transparent 30%),
        #05050f;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .bg-block {
      position: fixed;
      width: 76px;
      height: 76px;
      border-radius: 16px;
      opacity: 0.16;
      transform: rotate(8deg);
      animation: floatBlock 8s ease-in-out infinite;
      pointer-events: none;
    }

    .bg-block.one {
      left: 12%;
      top: 14%;
      background: #ff007a;
    }

    .bg-block.two {
      right: 13%;
      top: 24%;
      width: 104px;
      height: 42px;
      background: #00f3ff;
      animation-delay: -2s;
    }

    .bg-block.three {
      left: 18%;
      bottom: 13%;
      width: 48px;
      height: 116px;
      background: #ffcc00;
      animation-delay: -4s;
    }

    @keyframes floatBlock {
      0%, 100% {
        transform: translateY(0) rotate(8deg);
      }

      50% {
        transform: translateY(-18px) rotate(13deg);
      }
    }

    .card {
      width: min(440px, 100%);
      padding: 34px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 42%),
        rgba(18, 18, 43, 0.94);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.48), 0 0 42px rgba(0, 243, 255, 0.18);
      backdrop-filter: blur(16px);
      position: relative;
      z-index: 1;
    }

    .logo {
      margin: 0 0 8px;
      font-size: 2.35rem;
      font-weight: 950;
      letter-spacing: 0;
      line-height: 1;
    }

    .logo span {
      background: linear-gradient(135deg, #00f3ff, #9d00ff, #ff007a);
      background-clip: text;
      color: transparent;
    }

    h1 {
      margin: 22px 0 8px;
      font-size: 1.35rem;
      line-height: 1.2;
    }

    p {
      margin: 0 0 22px;
      color: #a5b4fc;
      line-height: 1.55;
    }

    label {
      display: block;
      margin: 14px 0 8px;
      color: #dbe6ff;
      font-size: 0.86rem;
      font-weight: 800;
    }

    input {
      width: 100%;
      min-height: 52px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 0 14px;
      background: #070711;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: #00f3ff;
      box-shadow: 0 0 0 3px rgba(0, 243, 255, 0.13);
    }

    button, .link-button {
      width: 100%;
      min-height: 54px;
      margin-top: 18px;
      border: 0;
      border-radius: 10px;
      display: inline-grid;
      place-items: center;
      background: linear-gradient(135deg, #ff007a, #7c3cff);
      color: #ffffff;
      font: inherit;
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(255, 0, 122, 0.28);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.72;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-weight: 800;
      line-height: 1.4;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: rgba(255, 62, 62, 0.12);
      color: #ff7474;
      border: 1px solid rgba(255, 62, 62, 0.32);
    }

    .message.success {
      background: rgba(0, 255, 157, 0.12);
      color: #70ffc6;
      border: 1px solid rgba(0, 255, 157, 0.28);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 26px;
      }

      .logo {
        font-size: 1.9rem;
      }
    }
  </style>
</head>

<body>
  <div class="bg-block one"></div>
  <div class="bg-block two"></div>
  <div class="bg-block three"></div>

  <main class="card">
    <div class="logo">BLOCK<span>BATTLE</span></div>
    <h1>Şifreni yenile</h1>
    <p id="intro">Yeni şifreni belirleyerek hesabına güvenli şekilde tekrar giriş yapabilirsin.</p>

    <form id="reset-form">
      <label for="password">Yeni şifre</label>
      <input id="password" type="password" minlength="6" autocomplete="new-password" required>

      <label for="password-confirm">Yeni şifre tekrar</label>
      <input id="password-confirm" type="password" minlength="6" autocomplete="new-password" required>

      <button id="submit-btn" type="submit">Şifreyi Güncelle</button>
    </form>

    <div id="message" class="message"></div>
    <a id="login-link" class="link-button hidden" href="/">Oyuna Geri Dön</a>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=4.5"></script>
  <script src="js/reset-password.js?v=1.0"></script>
</body>

</html>
